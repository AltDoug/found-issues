name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly canary on main. Some test fixtures are time-sensitive (e.g. entry
  # freshness vs the 30-day stale threshold) and the suite can rot on a repo
  # where no PR lands for weeks — 2026-07-09: 12 tests silently red since
  # ~June 12 because fixture dates crossed the stale threshold, discovered
  # only when the next PR was being prepared. This surfaces such breakage
  # within a week instead.
  #
  # Known limit: GitHub auto-disables scheduled workflows in public repos
  # after 60 days without repository activity (cron runs don't count) — it
  # emails a notice and the canary stops until manually re-enabled. So this
  # covers idle windows up to ~2 months; past that, re-enable from the
  # Actions tab or push any commit. workflow_dispatch does not prevent the
  # auto-disable.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Cancel in-progress runs when a new commit lands on the same PR / branch.
# Saves CI minutes (especially on macOS, ~10x rate) and stops stale results
# from clobbering fresh ones when fix-up commits arrive in quick succession.
# event_name is part of the group so the Monday canary (schedule) and manual
# dispatch runs never share a group with push-to-main — without it, a push
# landing during the ~15-min canary window cancels the canary (or vice versa,
# leaving the merged commit's checks 'cancelled').
#
# cancel-in-progress is OFF for push-to-main. A push cancelling the previous
# push's run silently voids the multi-OS verification of whatever that run was
# testing: the cancelled run's `ci` correctly reports failure, but the NEWER run
# is the one whose status attaches to the branch head — and when that newer push
# is docs-only, every job skips and `ci` reports success. Net effect: main reads
# green having never run bats on macOS.
#
# Hit for real 2026-08-11 — a one-line ledger flip (#130) merged two minutes
# after the v2.2.1 fix (#129) and cancelled its matrix mid-run; caught only by
# watching the run, recovered by re-running it by hand.
#
# cancel-in-progress: false alone is NOT enough. It protects a RUNNING push
# matrix, but GitHub also keeps at most ONE *pending* run per group — so while
# run A is in_progress and run B sits queued behind it, a third push CANCELS
# the queued B before it starts (shows as 'cancelled' with zero jobs). Hit for
# real 2026-08-12: the docs-only #147 push displaced the queued v2.2.7 matrix
# outright; the replacement run then skipped every bats job via the path filter
# while `ci` reported success — the exact green-but-unverified state the
# paragraph above describes, reached through the pending path instead. So push
# runs also get a per-SHA group suffix: every push owns its own group, nothing
# ever queues behind anything, and displacement is structurally impossible.
# The cost is concurrent matrices when merges land back-to-back — bounded by
# how often that happens, and strictly better than voiding one of them.
#
# Fixing it at the aggregator instead was considered and rejected: `ci` already
# treats `cancelled` as blocking (it did report failure here), so the aggregator
# was never the defect — and failing it on *skipped* bats would break the
# legitimate docs-only-push skip that the path filter exists to provide.
#
# PRs keep cancelling AND keep per-ref (not per-SHA) groups: that is where
# fix-up commits arrive in quick succession and stale results are pure waste.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  # Detect whether this PR/push touches anything that affects test outcomes.
  # Cosmetic-only changes (screenshots, LICENSE, .gitignore, docs/, hero.tape,
  # CONTRIBUTING, SECURITY) skip the matrix — the `ci` aggregator below treats
  # `skipped` as `success` so branch protection is satisfied without burning
  # ~7 min on a PNG swap. CHANGELOG-only changes run version-check (see the
  # `meta` filter); README/AGENTS changes run the full matrix because
  # tests/docs-consistency.bats asserts on them.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      # Scheduled/manual runs have no diff to filter — force the full matrix.
      code: ${{ steps.filter.outputs.code || steps.force.outputs.code }}
      # `meta`: files with their own dedicated check but no bats coverage.
      # CHANGELOG.md drives version-check (FI_VERSION match + SemVer rules) —
      # excluding it from `code` alone made a CHANGELOG-only PR skip exactly
      # the job built to validate it.
      meta: ${{ steps.filter.outputs.meta || steps.force.outputs.meta }}
      # Two-tier OS matrix (2026-07-20 CI-cost work): PR iterations run the
      # suite on ubuntu only (1x rate); the full macos+ubuntu matrix runs on
      # push-to-main, the weekly canary, and manual dispatch. macOS bills
      # ~10x per minute — most of the month's spend was PR iterations
      # re-proving OS parity the suite already proves on every merge.
      # windows-latest RETIRED 2026-08-28 (operator decision, same day as
      # agent-config#401): no Windows Claude Code host exists — Windows is
      # driven over SSH from the Mac — and the leg cost 148 billed min in
      # the first 12 days of the cycle that tripped the account spend cap.
      # The Git-Bash install branch, ASCII-name guard and Windows-compat
      # code stay; re-add = put "windows-latest" back in the list below.
      # Quality floor: every commit that LANDS still runs both remaining
      # OSes; only not-yet-merged iterations are trimmed.
      os-matrix: ${{ steps.osmat.outputs.os }}
    steps:
      - id: osmat
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-latest", "macos-latest"]' >> "$GITHUB_OUTPUT"
          fi
      - id: force
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          echo "code=true" >> "$GITHUB_OUTPUT"
          echo "meta=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: github.event_name == 'push' || github.event_name == 'pull_request'
      - id: filter
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          # `every`: a file matches `code` only when it satisfies ALL patterns
          # in the list — i.e. `**` AND NOT any of the `!` excludes. The
          # default `some` quantifier matches if ANY pattern matches; with
          # `**` always-matching, the negatives never kick in and the filter
          # is effectively a no-op (PR #45 smoke-tested this and the matrix
          # ran for a CHANGELOG-only change). `every` makes the negatives
          # actually subtractive.
          predicate-quantifier: every
          # Negative globs: `code` is true unless EVERY changed file is cosmetic.
          # `commands/*.md` is intentionally NOT excluded — slash command
          # markdown is functional (frontmatter + instructions consumed by
          # Claude Code), so changes deserve full CI even though no bats test
          # asserts on them. `.github/workflows/**` is also intentionally
          # included so workflow edits run their own new test suite.
          # README.md and AGENTS.md are intentionally NOT excluded —
          # tests/docs-consistency.bats exists specifically to catch their
          # drift, and excluding them skipped the matrix on exactly the PRs
          # it was built for.
          filters: |
            code:
              - '**'
              - '!CHANGELOG.md'
              - '!CONTRIBUTING.md'
              - '!SECURITY.md'
              - '!LICENSE'
              - '!**/*.png'
              - '!**/*.jpg'
              - '!**/*.gif'
              - '!hero.tape'
              - '!.gitignore'
              - '!docs/**'
            meta:
              - 'CHANGELOG.md'

  bats:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: bats (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.os-matrix) }}

    # Force bash on Windows runners (default is PowerShell). Git Bash ships
    # on windows-latest and provides bash + GNU coreutils — the same
    # toolchain the plugin expects on real Windows installs (Git for Windows
    # is a near-universal install for any Windows dev box).
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Install bats-core + jq
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install bats-core jq
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            # bats-core ships an npm package that drops a Windows-compatible
            # bats wrapper on PATH. jq is preinstalled on windows-latest.
            npm install -g bats
            jq --version
          else
            sudo apt-get update
            sudo apt-get install -y bats jq
          fi

      - name: Verify dependencies
        run: |
          bash --version
          bats --version
          jq --version
          git --version

      - name: Configure git identity (required for tests that commit)
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - name: Run test suite
        run: bats tests/

  shellcheck:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run shellcheck on hooks and CLI
        # SHA-pinned (master @ 2024-06-20). Latest tag is 2.0.0 from Jan 2023,
        # ~18 months stale vs master, so master is the de-facto current ref —
        # but `@master` is a live supply-chain risk (anyone with write to the
        # action's master branch runs in our CI). Pinning to a SHA freezes
        # what we run; Dependabot will propose SHA bumps on its weekly cadence.
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca
        with:
          severity: warning
          scandir: '.'
          additional_files: 'bin/found-issues'
        continue-on-error: true  # Advisory; don't block PR on shellcheck warnings

  json-lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: json validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate plugin manifests
        run: |
          for f in .claude-plugin/plugin.json hooks/hooks.json; do
            echo "Validating $f..."
            jq empty "$f"
          done

  version-check:
    needs: changes
    # Runs on code changes AND on CHANGELOG-only changes (`meta`) — the job
    # exists to validate CHANGELOG, so a CHANGELOG-only PR must not skip it.
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.meta == 'true'
    name: version check (SemVer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify FI_VERSION + CHANGELOG consistency
        # See docs/versioning.md for the rules + decision tree.
        # The script enforces:
        #   1. FI_VERSION in bin/found-issues matches the top CHANGELOG version.
        #   2. PATCH bumps (X.Y.Z+1) must NOT contain '### Added' — additive
        #      changes require a MINOR bump per SemVer 2.0.0.
        # Catches the v1.0.5 mistake retroactively-impossible (immutable tag)
        # but prevents recurrence going forward.
        run: bash scripts/check-version.sh

  test-name-lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: test name ASCII guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject non-ASCII characters in @test names
        # Why this exists: bats on Git Bash for Windows can't parse multi-byte
        # UTF-8 sequences in test NAMES (the body is fine — only the name is
        # parsed by bats's test discovery). When it hits one, it silently
        # drops the test and emits a confusing "expected N got N-1" failure
        # ~6 minutes into the Windows runner. We hit this three times across
        # v1.0.1, v1.0.2, v1.0.3 (em-dash, middle-dot, em-dash again).
        # Catching it here in ~5s on a Linux runner saves the round-trip.
        #
        # Using perl rather than grep because grep's byte-range bracket
        # expressions don't reliably match high bytes across GNU/BSD/locale
        # variations. Perl's \x00-\x7f negation works everywhere.
        run: |
          set -euo pipefail
          matches=$(perl -ne 'print "$ARGV:$.: $_" if /^\@test "[^"]*[^\x00-\x7f]/' tests/*.bats 2>/dev/null || true)
          if [[ -n "$matches" ]]; then
            echo "ERROR: bats test names must be ASCII-only (Git Bash on Windows can't parse non-ASCII names)."
            echo ""
            echo "Found in:"
            echo "$matches"
            echo ""
            echo "Fix: rename the test to ASCII. The body can still assert against any character — only the @test name matters."
            exit 1
          fi
          echo "All @test names are ASCII."

  # Aggregator job — the SINGLE required status check in branch protection.
  # Why aggregator: if we made `bats`/`shellcheck`/etc. each individually
  # required, the path-filter skip would leave them in `Expected` state
  # forever and block merging cosmetic-only PRs. With one aggregator that
  # reports `success` when its dependencies are `success` OR `skipped`,
  # cosmetic PRs go green in seconds and code PRs still block on real
  # failures.
  ci:
    name: ci
    needs: [bats, shellcheck, json-lint, test-name-lint, version-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded or were skipped
        run: |
          set -euo pipefail
          # Each `needs.<job>.result` is one of: success, failure, cancelled, skipped.
          # success / skipped → OK (skipped means path filter excluded this PR).
          # failure / cancelled → fail the aggregator → block the merge.
          declare -A results=(
            [bats]='${{ needs.bats.result }}'
            [shellcheck]='${{ needs.shellcheck.result }}'
            [json-lint]='${{ needs.json-lint.result }}'
            [test-name-lint]='${{ needs.test-name-lint.result }}'
            [version-check]='${{ needs.version-check.result }}'
          )
          fail=0
          for job in "${!results[@]}"; do
            r="${results[$job]}"
            case "$r" in
              success|skipped) printf '  %-16s %s\n' "$job:" "$r" ;;
              *)               printf '  %-16s %s (BLOCKING)\n' "$job:" "$r"; fail=1 ;;
            esac
          done
          if (( fail == 1 )); then
            echo
            echo "ci: at least one required job failed or was cancelled — blocking merge."
            exit 1
          fi
          echo
          echo "ci: all required jobs succeeded or were skipped (cosmetic-only PR)."
